# Custom BoT-SORT config - Stage 6 tuning
# Same track_buffer increase as bytetrack_tuned.yaml, for a fair comparison.
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 75
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
model: auto  # required by newer Ultralytics versions even when with_reid is False
