# Custom ByteTrack config - Stage 6 tuning
# Based on Ultralytics defaults, with track_buffer increased.
#
# track_buffer: how many frames a track is kept "alive" (remembered) after
# it stops being detected, before giving up and treating its reappearance
# as a brand new player. Default is 30 frames (~1.2s at 25fps). Doubling
# this to 75 frames (~3s) gives players more room to be briefly occluded
# (e.g. behind another player during a tackle) without losing their ID.
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 75
match_thresh: 0.8
fuse_score: True
