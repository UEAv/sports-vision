paths:
  raw_videos: "data/raw_videos"
  frames: "data/frames"
  annotations: "data/annotations"
  models: "models"
  logs: "logs"

ingestion:
  supported_formats: [".mp4", ".mkv", ".avi"]

sampling:
  frame_interval: 5
  target_fps: null

detection:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.4
  device: "cpu"

tracking:
  tracker: "bytetrack"
  track_thresh: 0.5
  match_thresh: 0.8

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/pipeline.log"
